# The URL the site will be built for
base_url = "https://joshua.olukotun.ng"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# The site title and description; used in feeds by default.
title = "Joshua Olukotun"
description = "Backend developer (Python, Rust) and mechanical engineer. Writing about things I build: embedded systems, servers, and side projects"

theme = "terminus"

generate_feeds = true

[markdown]
# Whether external links are to be opened in a new tab
# If this is true, a `rel="noopener"` will always automatically be added for security reasons
external_links_target_blank = true

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
stylesheets = ["custom.css"]
favicon = "images/favicon.png"
default_social_image = "images/og-home.png"

main_menu = [
    { name = "blog", url = "/blog/", trailing_slash = true },
]

socials = [
    { name = "github", url = "https://github.com/Josh596" },
    { name = "linkedin", url = "https://www.linkedin.com/in/joshua-olukotun/" },
    { name = "email", url = "mailto:joshua@olukotun.ng" },
]

[extra.content_security_policy]
enable = true
allowed_domains = [
    { directive = "script-src", domains = ["'self'", "stats.olukotun.ng"] },
    { directive = "connect-src", domains = ["'self'", "stats.olukotun.ng"] },
]

